<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>壹查 CheckOne</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div id="app">
  <nav id="tabs">
    <button data-tab="dashboard" class="active">仪表盘</button>
    <button data-tab="chat">对话 Asha</button>
    <button data-tab="config">设置</button>
  </nav>

  <section id="tab-dashboard" class="tab-content active">
    <div class="actions-bar">
      <button id="btn-screenshot-full">截图全屏</button>
      <button id="btn-new-monitor">新建监控</button>
    </div>
    <div id="new-monitor-row" style="display:none; gap:6px; margin-bottom:12px;">
      <select id="nm-type" style="padding:4px 8px; border:1px solid #d2d2d7; border-radius:6px;">
        <option value="terminal">终端命令</option>
        <option value="web">网页 URL</option>
      </select>
      <input type="text" id="nm-input" placeholder="如：npm install 或 https://example.com" style="flex:1; padding:4px 10px; border:1px solid #d2d2d7; border-radius:6px;" />
      <button id="nm-submit">开始</button>
      <button id="nm-cancel">取消</button>
    </div>
    <div id="monitor-list">
      <p class="empty-hint">暂无活跃监控。在「对话 Asha」中用自然语言创建，或点击「新建监控」。</p>
    </div>
  </section>

  <section id="tab-chat" class="tab-content">
    <div id="chat-messages"></div>
    <form id="chat-form">
      <input type="text" id="chat-input" placeholder="对 Asha 说点什么…" autocomplete="off" />
      <button type="submit">发送</button>
    </form>
  </section>

  <section id="tab-config" class="tab-content">
    <div class="settings-header">
      <h1>设置</h1>
      <p class="subtitle">配置 AI 助手和监控偏好</p>
    </div>

    <div id="llm-warning" class="warning-banner" style="display:none;">
      <span>⚠ LLM 尚未配置，Asha 无法对话。请在下方填写 API 信息。</span>
    </div>

    <section class="card">
      <div class="card-header-row"><h2>AI 助手（Asha · 艾莎）</h2></div>
      <p class="muted">任意 OpenAI 兼容接口。Base URL 填到版本号即可（如 …/v1），Key 在所有 AI 功能中共用。</p>

      <label>服务商预设</label>
      <select id="cfg-preset">
        <option value="custom">自定义</option>
        <option value="openai">OpenAI</option>
        <option value="deepseek">DeepSeek</option>
        <option value="dashscope">DashScope (通义千问)</option>
        <option value="glm">GLM (智谱)</option>
        <option value="moonshot">Moonshot (月之暗面)</option>
        <option value="volcengine">Volcengine (火山引擎)</option>
        <option value="ollama">Ollama (本地)</option>
      </select>

      <label>Base URL</label>
      <input type="text" id="cfg-baseUrl" placeholder="https://api.deepseek.com/v1" />

      <label>API Key</label>
      <input type="password" id="cfg-apiKey" placeholder="sk-…" />

      <label>模型</label>
      <input type="text" id="cfg-model" placeholder="deepseek-v4-flash" />

      <div class="row">
        <button type="button" class="chip" id="btn-llm-test">测试连接</button>
        <span id="llm-test-result" class="test-result"></span>
      </div>
    </section>

    <section class="card">
      <div class="card-header-row"><h2>监控设置</h2></div>
      <p class="muted">控制截图频率、终端轮询和通知行为。</p>

      <label>截图间隔（秒）</label>
      <input type="number" id="cfg-ss-interval" min="1" value="5" />

      <label>终端轮询间隔（秒）</label>
      <input type="number" id="cfg-poll-interval" min="1" value="2" />

      <label>自动清理截图（天）</label>
      <input type="number" id="cfg-cleanup-days" min="1" value="7" />

      <div class="toggle-row"><span>监控完成时通知</span><label class="switch"><input type="checkbox" id="cfg-notify-done" checked /><span class="slider"></span></label></div>
      <div class="toggle-row"><span>监控出错时通知</span><label class="switch"><input type="checkbox" id="cfg-notify-error" checked /><span class="slider"></span></label></div>
    </section>

    <section class="card">
      <div class="card-header-row"><h2>快捷键</h2></div>
      <div class="toggle-row"><span>唤起 Asha</span><span class="muted">⌘⇧A</span></div>
      <div class="toggle-row"><span>发送当前浏览器 URL</span><span class="muted">⌘⇧C</span></div>
    </section>

    <div class="save-bar"><button id="btn-save-all">保存设置</button></div>
  </section>
</div>
<script src="/app.js"></script>
</body>
</html>
